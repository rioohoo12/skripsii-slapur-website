# Apache Virtual Host Configuration for SLAPUR Backend & SPA Frontend
# Simpan file ini di /etc/apache2/sites-available/slapur.conf (Linux) atau extra/httpd-vhosts.conf (Windows XAMPP)

<VirtualHost *:80>
    ServerName slapur.local
    ServerAlias www.slapur.local
    DocumentRoot "c:/Users/Lenovo/Downloads/project-skripsi-main/project-skripsi-main/backend/public"

    <Directory "c:/Users/Lenovo/Downloads/project-skripsi-main/project-skripsi-main/backend/public">
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Load Required Modules in httpd.conf:
    # LoadModule rewrite_module modules/mod_rewrite.so
    # LoadModule headers_module modules/mod_headers.so

    # Security Headers via mod_headers
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # Error Logs
    ErrorLog "${APACHE_LOG_DIR}/slapur_error.log"
    CustomLog "${APACHE_LOG_DIR}/slapur_access.log" combined
</VirtualHost>

